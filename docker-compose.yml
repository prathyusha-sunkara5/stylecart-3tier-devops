services:
  db:
    image: mysql:8.4
    container_name: stylecart-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stylecart
      MYSQL_USER: stylecart
      MYSQL_PASSWORD: stylecart_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_dev_password --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: stylecart-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: stylecart
      DB_USER: stylecart
      DB_PASSWORD: stylecart_dev_password
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  frontend:
    build: ./frontend
    container_name: stylecart-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
